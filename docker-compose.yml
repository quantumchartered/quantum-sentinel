# Quantum Sentinel local stack. Project name is fixed so it never collides with
# other Compose projects on this machine (e.g. Quantum Chartered on :5432).
name: quantum-sentinel

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      # Local-only development password; override in .env. Bound to 127.0.0.1.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_local_dev}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - sentinel-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  sentinel-pg:
